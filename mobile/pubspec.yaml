name: younz_digital_center
description: Aplikasi Android pelanggan Younz Digital Center.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/products/
