<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Younz — revisi logo biru</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font:14px Arial,sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:20px;margin:0;font-weight:600}header span{color:#667085}.wordmark{background:white;border:1px solid #e5e7eb;padding:32px 12px}.wordmark img{display:block;width:100%;height:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.card{background:white;border:1px solid #e5e7eb;padding:32px}.icons{display:flex;align-items:center;gap:28px;min-height:160px}.icons img{width:128px;height:128px}.icons img.small{width:48px;height:48px;border-radius:50%}h2{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#667085;font-weight:400;margin:0 0 24px}.swatch{width:64px;height:64px;background:#1649d8;margin-bottom:18px}p{line-height:1.7;margin:8px 0}a{color:#1649d8}footer{margin-top:24px;color:#667085}@media(max-width:600px){.row{grid-template-columns:1fr}header{display:block}header span{display:block;margin-top:10px}main{padding:24px 16px}.wordmark{padding:28px 0}}
</style>
</head>
<body><main>
<header><h1>Younz Digital Center</h1><span>Revisi 02 · Biru solid</span></header>
<section class="wordmark"><img src="logo-younz-concept.svg" alt="Logo lengkap Younz Digital Center"></section>
<div class="row"><section class="card"><h2>Avatar &amp; ukuran kecil</h2><div class="icons"><img src="logo-younz-icon.svg" alt="Avatar persegi"><img class="small" src="logo-younz-icon.svg" alt="Avatar lingkaran kecil"></div></section>
<section class="card"><h2>Warna utama</h2><div class="swatch"></div><p><strong>Royal blue · #1649D8</strong></p><p>Satu warna. Tanpa gradasi, bayangan, dan aksen piksel.</p></section></div>
<footer><a href="logo-younz-concept.svg">Logo lengkap SVG</a> &nbsp; / &nbsp; <a href="logo-younz-icon.svg">Ikon SVG</a><p>Lettering sudah berupa vektor; tidak membutuhkan font terpasang.</p></footer>
</main></body></html>
