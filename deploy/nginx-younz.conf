server {
    listen 80;
    listen [::]:80;
    server_name younzdigitalcenter.my.id www.younzdigitalcenter.my.id admin.younzdigitalcenter.my.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# YOUNZ ERP Laravel API. The API process must listen on 127.0.0.1:8001 on the
# same server. Obtain/renew an HTTPS certificate that includes this hostname
# before enabling the 443 block below.
server {
    listen 80;
    listen [::]:80;
    server_name erp.younzdigitalcenter.my.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.younzdigitalcenter.my.id;

    ssl_certificate /etc/letsencrypt/live/younzdigitalcenter.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/younzdigitalcenter.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YounzSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
